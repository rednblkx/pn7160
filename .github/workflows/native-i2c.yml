name: Native I2C

on: [push, pull_request]

permissions:
  contents: read

jobs:
  transport-tests:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        compiler: [g++, clang++]
    steps:
      - uses: actions/checkout@v4
      - name: Test simulated API branches with sanitizers
        env:
          CXX: ${{ matrix.compiler }}
        run: python3 test/native_i2c/run.py

  native-example:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build native ESP-IDF example, including SPI and NCI sources
        uses: espressif/esp-idf-ci-action@v1
        with:
          esp_idf_version: v5.5.4
          target: esp32
          path: examples/native_i2c
